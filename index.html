<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trans-taler</title>
<meta name="theme-color" content="#1b1236">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Trans-taler">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Mali:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a sunny meadow world (forest, a cottage, a library). Tap the cottage to choose a level; the world dims and a periwinkle storybook rises in front of it. Each spread = one question: prompt on the left page, answer key on the right. Single bright theme by choice. */
:root{
  color-scheme: light;
  --ink:#2a2358;
  --ink-soft:#6f68a0;
  --violet:#6d4fe0;
  --pink:#ff6fae;
  --mint:#2fbfa8;
  --paper:#fffdf7;
  --paper-2:#fbf3e6;
  --holo:linear-gradient(115deg,#7ee8fa 0%,#9fb4ff 22%,#d3a6ff 42%,#ffa6d1 62%,#ffe29a 82%,#7ee8fa 100%);
  --f-logo:"Fredoka","Mali",sans-serif;
  --f-head:"Mali","Sarabun",sans-serif;
  --f-body:"Sarabun","Mali",sans-serif;
  --f-en:"Fredoka","Mali",sans-serif;
  --pw:340px; --ph:600px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#170f33;color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.65;overflow:hidden}
h1,h2,h3{font-family:var(--f-head);font-weight:700;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--pink);outline-offset:3px}

/* ───── the round library (home), rendered in WebGL ───── */
#room{position:fixed;inset:0;z-index:0;overflow:hidden;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;background:#1b1236}
#room.dragging{cursor:grabbing}
#room.pointing{cursor:pointer}
#room canvas{display:block;width:100%;height:100%}
.room-light{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse 80% 75% at 50% 50%,transparent 60%,rgba(12,6,30,.55))}
.altar-label{position:fixed;left:50%;top:80%;z-index:3;transform:translate(-50%,-50%);border:0;cursor:pointer;white-space:nowrap;
  font-family:var(--f-head);font-weight:700;font-size:15px;color:#4a2f08;padding:5px 16px;border-radius:999px;
  background:linear-gradient(180deg,#fff3c4,#f0c860);box-shadow:0 0 0 2px #fff7d6,0 6px 18px rgba(255,200,90,.5);transition:transform .2s ease}
.altar-label:hover{transform:translate(-50%,-62%)}
.booktip{position:fixed;z-index:5;pointer-events:none;display:none;max-width:260px;padding:8px 12px;border-radius:14px;background:#fff;color:var(--ink);
  font-family:var(--f-head);font-weight:700;font-size:14px;line-height:1.45;box-shadow:0 0 0 2px #ffe29a,0 10px 22px rgba(0,0,0,.35)}
.booktip small{display:block;font-weight:600;font-size:12.5px;color:var(--ink-soft)}
@keyframes bobs{50%{transform:translateY(-10px)}}
.turn{position:fixed;top:42%;z-index:4;width:54px;height:54px;margin-top:-27px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;
  font-size:20px;color:#5a3fd0;background:rgba(255,255,255,.88);box-shadow:0 0 0 3px rgba(255,236,170,.6),0 10px 22px rgba(0,0,0,.35)}
.turn:hover{background:#fff}
#turnL{left:14px}#turnR{right:14px}
.btn.allbooks{position:fixed;top:14px;right:14px;z-index:4}
.hint{position:fixed;left:50%;top:clamp(130px,22vh,190px);z-index:4;transform:translateX(-50%);pointer-events:none;white-space:nowrap;
  font-family:var(--f-head);font-weight:700;font-size:15px;color:#fff;padding:7px 16px;border-radius:999px;background:rgba(20,12,45,.65);transition:opacity .6s ease}
.hint.off{opacity:0}
body.reading .turn,body.reading .allbooks,body.reading .altar-label,body.reading .hint,body.reading .booktip{display:none}

/* mystery book: pick the level on its cover */
.mcover{zoom:var(--fz,1);position:relative;width:min(430px,100%);max-height:calc(100% - 8px);overflow-y:auto;border-radius:6px 18px 18px 6px;padding:22px 20px 20px 40px;color:#fff;
  background:radial-gradient(circle at 20% 8%,rgba(255,255,255,.18),transparent 40%),radial-gradient(circle,rgba(255,255,255,.12) 1px,transparent 1.5px) 0 0/16px 16px,linear-gradient(160deg,#4a35a8,#2a1d78 55%,#170f45);
  box-shadow:inset -3px 0 6px rgba(0,0,0,.35),3px 3px 0 #fffaf0,6px 6px 0 #e6dcf0,9px 9px 0 #22175e,0 30px 60px rgba(0,0,0,.5);animation:pop .45s cubic-bezier(.3,1.5,.5,1) both}
.mcover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:24px;background:linear-gradient(90deg,rgba(0,0,0,.45),rgba(255,255,255,.12) 40%,rgba(0,0,0,.3) 70%,transparent)}
.m-in{position:relative;border:2px solid #e9c46a;border-radius:14px;padding:16px 14px 14px;box-shadow:inset 0 0 0 4px rgba(0,0,0,0),inset 0 0 0 5px rgba(233,196,106,.4)}
.m-top{text-align:center;font-family:var(--f-logo);font-weight:700;letter-spacing:.22em;font-size:12px;color:#e9c46a}
.m-q{width:92px;height:92px;margin:4px auto 2px;display:grid;place-items:center;font-family:var(--f-logo);font-weight:700;font-size:64px;color:#ffe08a;
  text-shadow:0 0 22px rgba(255,224,138,.9);border-radius:50%;background:radial-gradient(circle,rgba(255,224,138,.28),transparent 70%);animation:bobs 2.6s ease-in-out infinite}
.mcover h2{text-align:center;color:#fff;font-size:clamp(22px,5vw,27px)}
.m-sub{text-align:center;font-family:var(--f-head);font-weight:600;font-size:15px;color:#d9d0ff;margin-top:2px}
.medals{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.medal{position:relative;cursor:pointer;border:0;border-radius:16px;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;line-height:1.25;
  background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 2px rgba(233,196,106,.55);transition:transform .15s ease}
.medal:hover{transform:translateY(-2px)}
.medal b{font-family:var(--f-logo);font-weight:700;font-size:23px;color:#ffe08a}
.medal span{font-family:var(--f-head);font-weight:600;font-size:12px;color:#d9d0ff}
.medal em{font-style:normal;font-family:var(--f-logo);font-weight:700;font-size:11px;margin-top:3px;padding:0 8px;border-radius:999px;color:#fff;background:rgba(255,255,255,.14)}
.medal[aria-pressed="true"]{background:linear-gradient(160deg,#fff3c4,#e8b84e);box-shadow:0 0 0 3px #fff6d0,0 0 22px rgba(255,220,120,.75)}
.medal[aria-pressed="true"] b,.medal[aria-pressed="true"] span,.medal[aria-pressed="true"] em{color:#4a2f08}
.medal[aria-pressed="true"] em{background:rgba(255,255,255,.45)}
.medal:disabled{opacity:.42;cursor:not-allowed;transform:none}
.medal .soon{position:absolute;top:-8px;right:-2px;font-family:var(--f-head);font-weight:700;font-size:10px;color:#2a1d78;background:#cfc4ff;padding:0 7px;border-radius:999px}
.m-likes{text-align:center;font-family:var(--f-head);font-weight:600;font-size:13.5px;line-height:1.6;color:#d9d0ff;margin-top:12px}
.m-likes b{color:#ffe08a}
.m-full{margin-top:12px;padding:8px 12px;border-radius:12px;text-align:center;font-family:var(--f-head);font-weight:700;font-size:14px;line-height:1.55;color:#4a2f08;background:#ffe9a8}
.mcover .row{margin-top:14px}
.mcover .fine{color:#b9aeea;text-align:center;margin-top:10px}
.mcover .x{background:rgba(255,255,255,.15);color:#fff;z-index:2}

.brand-top{position:fixed;top:14px;left:0;right:0;z-index:2;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding:0 16px;text-align:center}
.logo{font-family:var(--f-logo);font-weight:700;font-size:clamp(32px,7vw,46px);line-height:1;letter-spacing:.01em;color:#fff;
  text-shadow:0 3px 0 #6d4fe0,0 6px 0 #4c33b8,0 12px 22px rgba(40,30,110,.35)}
.logo span{color:#ffe36e}
.tagline{font-family:var(--f-head);font-weight:700;font-size:16px;color:#4c33b8;background:#fff;padding:4px 16px;border-radius:999px;box-shadow:0 0 0 3px rgba(255,255,255,.55),0 6px 14px rgba(40,30,110,.18)}

.toast{position:fixed;left:50%;bottom:24px;z-index:20;transform:translate(-50%,30px);opacity:0;transition:.35s ease;pointer-events:none;
  font-family:var(--f-head);font-weight:700;font-size:15px;color:#fff;background:#6d4fe0;padding:10px 20px;border-radius:999px;box-shadow:0 10px 24px rgba(40,30,110,.35);max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* buttons */
.btn{position:relative;overflow:hidden;cursor:pointer;white-space:nowrap;border:0;border-radius:999px;padding:11px 26px;
  font-family:var(--f-head);font-weight:700;font-size:17px;color:#fff;text-shadow:0 1px 1px rgba(60,30,150,.4);
  background:linear-gradient(135deg,#ff7fb8,#9b7bff 58%,#5fa8ff);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.5),inset 0 -3px 0 rgba(60,30,150,.2),0 0 0 3px #fff,0 0 0 4.5px rgba(155,123,255,.55),0 10px 22px rgba(120,90,230,.4);
  transition:transform .18s ease}
.btn::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);transition:left .6s ease}
.btn:hover{transform:translateY(-2px)}
.btn:hover::after{left:120%}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.small{font-size:14.5px;padding:7px 16px}
.btn.chip{color:#5a3fd0;text-shadow:none;background:linear-gradient(180deg,#fff,#efe8ff);box-shadow:inset 0 -2px 0 rgba(155,123,255,.22),0 0 0 2px rgba(155,123,255,.6),0 6px 12px rgba(155,123,255,.18)}
.btn.chip.mint{color:#14907d;background:linear-gradient(180deg,#fff,#dffaf4);box-shadow:inset 0 -2px 0 rgba(47,191,168,.25),0 0 0 2px rgba(47,191,168,.7),0 6px 12px rgba(47,191,168,.18)}
.btn.cam{font-size:14.5px;padding:7px 16px;color:#5a3fd0;text-shadow:none;background:#fff;box-shadow:0 0 0 2px rgba(155,123,255,.5),0 6px 14px rgba(0,0,0,.15)}
.btn.cam[aria-pressed="true"]{color:#fff;text-shadow:0 1px 1px rgba(60,30,150,.4);background:linear-gradient(135deg,#ff7fb8,#9b7bff 58%,#5fa8ff);box-shadow:0 0 0 2px #fff,0 0 0 3.5px rgba(155,123,255,.55)}

/* ───── level modal ───── */
#modal{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(16,10,38,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#modal.on{display:flex;animation:fade .3s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.card{zoom:var(--fz,1);position:relative;width:100%;max-width:640px;max-height:calc(100% - 8px);overflow-y:auto;padding:26px 22px 22px;border-radius:30px;background:#fff;
  box-shadow:0 0 0 4px #fff,0 0 0 8px rgba(155,123,255,.35),0 30px 60px rgba(30,40,80,.35);animation:pop .45s cubic-bezier(.3,1.5,.5,1) both}
@keyframes pop{from{transform:translateY(30px) scale(.92);opacity:0}to{transform:none;opacity:1}}
.card::before{content:"";position:absolute;left:30px;right:30px;top:0;height:5px;border-radius:0 0 5px 5px;background:var(--holo)}
.card-head{display:flex;align-items:center;gap:12px}
.card-head h2{font-size:clamp(22px,5vw,28px);color:var(--ink);line-height:1.35}
.kicker{font-family:var(--f-logo);font-weight:700;letter-spacing:.12em;font-size:12.5px;color:#7a5ae0;text-transform:uppercase}
.x{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:50%;border:0;cursor:pointer;background:#f1ecff;color:#5a3fd0;font-size:20px;font-weight:700;line-height:1}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.lv{position:relative;cursor:pointer;border:0;border-radius:20px;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;line-height:1.3;
  background:#fff;color:var(--c1);box-shadow:0 0 0 2.5px color-mix(in srgb,var(--c1) 50%,#fff),0 8px 16px color-mix(in srgb,var(--c1) 18%,transparent)}
.lv b{font-family:var(--f-logo);font-weight:700;font-size:26px}
.lv span{font-family:var(--f-head);font-weight:600;font-size:13px;color:var(--ink-soft)}
.lv em{font-style:normal;font-family:var(--f-logo);font-size:12.5px;font-weight:700;margin-top:4px;padding:1px 9px;border-radius:999px;background:color-mix(in srgb,var(--c1) 14%,#fff)}
.lv[aria-pressed="true"]{color:#fff;background:linear-gradient(160deg,var(--c2),var(--c1));box-shadow:0 0 0 3px #fff,0 0 0 5px var(--c1),0 12px 22px color-mix(in srgb,var(--c1) 40%,transparent);transform:translateY(-2px)}
.lv[aria-pressed="true"] span{color:#fff}
.lv[aria-pressed="true"] em{background:rgba(255,255,255,.3)}
.lv:disabled{cursor:not-allowed;opacity:.5}
.lv .soon{position:absolute;top:-9px;right:-2px;font-family:var(--f-head);font-size:10.5px;font-weight:700;color:#fff;background:#b4a9de;padding:0 8px;border-radius:999px}
.desc{margin-top:16px;font-size:15px;color:var(--ink-soft)}
.card .row{margin-top:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.end{justify-content:flex-end}.row.mid{justify-content:center}
.fine{font-size:13px;line-height:1.55;color:var(--ink-soft)}

/* ───── first-time profile (phase 2) ───── */
#onboard{position:fixed;inset:0;z-index:11;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(16,10,38,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#onboard.on{display:flex;animation:fade .3s ease both}
.steps{display:flex;gap:6px;justify-content:center;margin:2px 0 14px}
.steps i{width:30px;height:7px;border-radius:7px;background:#e6e0f8}
.steps i.on{background:linear-gradient(90deg,#ff7fb8,#9b7bff)}
.ob-q{font-size:clamp(21px,5vw,27px);line-height:1.4;color:var(--ink)}
.ob-sub{font-family:var(--f-head);font-weight:600;font-size:15px;color:var(--ink-soft);margin-top:4px}
.field{width:100%;margin-top:14px;font-family:var(--f-head);font-weight:700;font-size:20px;padding:12px 16px;border-radius:16px;border:0;background:#f5f1ff;box-shadow:inset 0 0 0 2.5px #ddd0ff;color:var(--ink)}
.field::placeholder{color:#b6abdc}
.field:focus{outline:none;box-shadow:inset 0 0 0 3px #9b7bff}
.chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}
.pick{cursor:pointer;border:0;border-radius:999px;padding:7px 15px;font-family:var(--f-head);font-weight:700;font-size:15px;color:#5a3fd0;background:#fff;box-shadow:0 0 0 2px #ddd0ff;transition:transform .15s ease}
.pick:hover{transform:translateY(-1px)}
.pick[aria-pressed="true"]{color:#fff;text-shadow:0 1px 1px rgba(60,30,150,.35);background:linear-gradient(135deg,#ff7fb8,#9b7bff);box-shadow:0 0 0 2px #fff,0 0 0 3.5px #b9a2ff,0 6px 12px rgba(155,123,255,.3)}
.ob-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px}
.btn.ghost{color:#5a3fd0;text-shadow:none;background:#f1ecff;box-shadow:none}
.btn.ghost[hidden]{display:none}
.count{font-family:var(--f-head);font-weight:700;font-size:14px;color:#8f74f0;margin-top:10px}
.err{font-family:var(--f-head);font-weight:700;font-size:14px;color:#e0408a;min-height:1.5em;margin-top:8px}
.sumlist{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.sumlist div{padding:10px 14px;border-radius:16px;background:#f5f1ff}
.sumlist b{display:block;font-family:var(--f-head);font-size:13px;color:#8f74f0}
.sumlist span{font-family:var(--f-head);font-weight:700;font-size:16px;color:var(--ink)}
.me-chip{position:fixed;top:14px;left:14px;z-index:4;display:flex;align-items:center;gap:8px;padding:4px 16px 4px 4px;border-radius:999px;border:0;cursor:pointer;background:#fff;
  box-shadow:0 0 0 2.5px rgba(155,123,255,.5),0 8px 18px rgba(40,30,110,.2);font-family:var(--f-head);font-weight:700;font-size:15px;color:#4c33b8}
.me-chip i{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:15px;color:#fff;font-family:var(--f-logo);background:linear-gradient(135deg,#ff7fb8,#9b7bff)}
.me-chip[hidden],body.reading .me-chip{display:none}
@media (max-width:600px){.brand-top{top:104px}.brand-top .tagline{display:none}.logo{font-size:28px}}

/* ───── phase 3: library of stories ───── */
#lib{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(16,10,38,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#lib.on{display:flex;animation:fade .3s ease both}
#set{position:fixed;inset:0;z-index:13;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(16,10,38,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#set.on{display:flex;animation:fade .3s ease both}
#set .card{max-width:500px}
.gear{width:40px;height:40px;flex:none;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;font-size:20px;line-height:1;color:#5a3fd0;background:#fff;box-shadow:0 0 0 2px rgba(155,123,255,.5),0 6px 14px rgba(0,0,0,.2)}
.gear.home{position:fixed;top:56px;right:14px;z-index:4}
body.reading .gear.home{display:none}
.setrow{display:flex;flex-direction:column;gap:8px;margin-top:16px;padding:12px 14px;border-radius:18px;background:#f5f1ff}
.setrow > b{font-family:var(--f-head);font-size:16px;color:var(--ink)}
.setrow > span{font-family:var(--f-head);font-weight:600;font-size:13.5px;color:var(--ink-soft)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{flex:1;min-width:70px;cursor:pointer;border:0;border-radius:14px;padding:8px 6px;font-family:var(--f-head);font-weight:700;font-size:14.5px;color:#5a3fd0;background:#fff;box-shadow:0 0 0 2px #ddd0ff}
.seg button[aria-pressed="true"]{color:#fff;background:linear-gradient(135deg,#ff7fb8,#9b7bff);box-shadow:0 0 0 2px #fff,0 0 0 3.5px #b9a2ff}
.preview{padding:10px 12px;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 2px #ece4ff}
#upg{position:fixed;inset:0;z-index:12;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(16,10,38,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#upg.on{display:flex;animation:fade .3s ease both}
#upg .card{max-width:520px}
.wallet{display:flex;align-items:baseline;gap:10px;justify-content:center;margin-top:14px;padding:10px;border-radius:18px;background:linear-gradient(180deg,#fff7d6,#ffe9a8)}
.wallet b{font-family:var(--f-logo);font-size:34px;color:#a8781f}
.wallet span{font-family:var(--f-head);font-weight:700;font-size:15px;color:#7a5410}
.lib-actions{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;padding:10px 14px;border-radius:18px;background:linear-gradient(180deg,#fff7d6,#ffe9a8)}
.lib-actions .pts{font-family:var(--f-head);font-weight:700;font-size:15px;color:#7a5410}
.lib-actions .pts b{font-family:var(--f-logo);font-size:24px;color:#a8781f;margin:0 4px}
.btn.upg{background:linear-gradient(135deg,#ffc24e,#ff8f6e 60%,#ff6fae)}
.turn[hidden]{display:none}
.turn:disabled{opacity:.35;cursor:default}
#lib .card{max-width:920px;background:repeating-linear-gradient(90deg,#fbf8ff 0 30px,#f4eeff 30px 60px)}
.lib-sub{font-family:var(--f-head);font-weight:600;font-size:15px;color:var(--ink-soft)}
.shelf{display:grid;grid-template-columns:repeat(var(--cols,3),1fr);column-gap:14px;row-gap:22px;margin-top:20px;padding:0 6px}
.slot{position:relative;display:flex;align-items:flex-end;justify-content:center;padding:0 4px 18px}
.slot::after{content:"";position:absolute;left:-8px;right:-8px;bottom:0;height:16px;background:linear-gradient(180deg,#e0a874,#c98552 55%,#a8673a);box-shadow:0 8px 12px rgba(120,70,30,.25)}
.slot:first-child::after,.slot.rowstart::after{left:-6px;border-radius:6px 0 0 6px}
.slot.rowend::after{right:-6px;border-radius:0 6px 6px 0}
.minibook{position:relative;width:100%;max-width:132px;aspect-ratio:3/4;border:0;padding:0;cursor:pointer;border-radius:3px 10px 10px 3px;color:#fff;overflow:hidden;
  background:radial-gradient(circle at 25% 15%,rgba(255,255,255,.35),transparent 45%),linear-gradient(160deg,var(--c2),var(--c1));
  box-shadow:inset 0 2px 0 rgba(255,255,255,.4),2px 2px 0 #fffaf0,4px 4px 0 #e6dcf0,0 10px 16px rgba(60,40,120,.3);transition:transform .2s ease}
.minibook:hover,.minibook:focus-visible{transform:translateY(-6px) rotate(-1.500deg)}
.minibook .sp{position:absolute;left:0;top:0;bottom:0;width:10px;background:linear-gradient(90deg,rgba(0,0,0,.22),rgba(255,255,255,.2) 50%,rgba(0,0,0,.12))}
.minibook .fr{position:absolute;inset:7px 7px 7px 15px;border:2px solid rgba(255,255,255,.75);border-radius:8px}
.minibook .tt{position:absolute;left:18px;right:10px;top:16px;font-family:var(--f-head);font-weight:700;font-size:clamp(12px,3.2vw,14.5px);line-height:1.45;text-align:center;text-shadow:0 1px 3px rgba(40,20,90,.5)}
.minibook .sl{position:absolute;left:calc(50% + 4px);bottom:30px;transform:translateX(-50%);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-logo);font-weight:700;font-size:13px;color:var(--c1);background:#fff;box-shadow:0 3px 8px rgba(40,20,90,.3)}
.minibook .sc{position:absolute;left:18px;right:10px;bottom:11px;text-align:center;font-family:var(--f-logo);font-weight:700;font-size:11.5px;opacity:.95}
.emptyslot{width:100%;max-width:132px;aspect-ratio:3/4;border-radius:10px;border:2.5px dashed rgba(155,123,255,.35);display:grid;place-items:center;font-family:var(--f-head);font-weight:600;font-size:13px;color:#b8acdf}
.lib-empty{display:flex;align-items:center;gap:12px;margin-top:16px;padding:12px 16px;border-radius:18px;background:#fff;box-shadow:0 0 0 2px #e6dcff}
.lib-empty p{font-family:var(--f-head);font-weight:700;font-size:16px;color:var(--ink)}

/* reading pages: Thai on top, English underneath */
.rp{padding:10px 12px;border-radius:16px;background:#fff;box-shadow:0 0 0 2px #ece4ff}
.rp .thai{font-size:clamp(17px,calc(var(--pw)*.054),21px)}
.rp .en{font-size:clamp(17px,calc(var(--pw)*.054),20px);font-weight:600;color:#14907d;margin-top:4px;padding-top:6px;border-top:2px dashed #e6dcff}
.rp .no{font-family:var(--f-logo);font-weight:700;font-size:12px;color:#b1a5dc}
.rfoot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px}
.rfoot .pagefoot{margin:0}

/* mascot */
.mascot{width:96px;height:auto;flex:none;animation:bobm 3.2s ease-in-out infinite;overflow:visible}
.mascot.mini{width:60px}
.mascot.big{width:118px}
@keyframes bobm{50%{transform:translateY(-6px)}}

/* ───── reading: the world dims, the book comes forward ───── */
body.smooth .scrim{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(10,6,24,.84)}
body.smooth #modal,body.smooth #lib,body.smooth #upg,body.smooth #onboard,body.smooth #set{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(10,6,28,.7)}
.scrim{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0;transition:opacity .7s ease;
  background:radial-gradient(ellipse 70% 60% at 50% 52%,rgba(20,12,40,.35),rgba(10,6,24,.8));-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px)}
body.reading .scrim{opacity:1}
body.reading .brand-top{display:none}
.bookscreen{position:fixed;inset:0;z-index:3;display:none;flex-direction:column;align-items:center}
body.reading .bookscreen{display:flex;animation:fade .5s ease both}
.topbar{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px 0}
.tb-title{font-family:var(--f-head);font-weight:700;font-size:15px;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.4);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#stage{position:relative;width:100%;flex:1;min-height:0}
#cam{position:absolute;left:50%;top:20px;width:0;height:var(--ph);transform-origin:0 50%;transition:transform 1s cubic-bezier(.55,0,.2,1)}
#book{position:absolute;left:0;top:0;width:0;height:100%;perspective:2600px}
.cambar{display:flex;gap:8px;padding:6px;margin:0 0 14px;border-radius:999px;background:rgba(255,255,255,.22);box-shadow:0 0 0 1.5px rgba(255,255,255,.4)}
.glowspot{position:absolute;top:calc(var(--ph)*.5 - var(--ph)*.62);left:calc(-1*var(--pw) - 120px);width:calc(2*var(--pw) + 240px);height:calc(var(--ph)*1.24);border-radius:50%;
  background:radial-gradient(closest-side,rgba(255,236,170,.45),rgba(255,236,170,.12) 60%,transparent);pointer-events:none}
#book:not(.open) .glowspot{left:calc(-120px);width:calc(var(--pw) + 250px)}
.bookshadow{position:absolute;top:16px;left:calc(-1*var(--pw) - 10px);width:calc(2*var(--pw) + 20px);height:var(--ph);border-radius:12px;box-shadow:0 34px 60px rgba(0,0,0,.55),0 8px 16px rgba(0,0,0,.4)}
#book:not(.open) .bookshadow{left:0;width:calc(var(--pw) + 10px)}
.board{position:absolute;top:-8px;width:calc(var(--pw) + 10px);height:calc(var(--ph) + 16px);background:linear-gradient(160deg,var(--bk2,#7d63ff),var(--bk1,#4fb4ff));box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
.board.L{left:calc(-1*var(--pw) - 10px);border-radius:12px 0 0 12px}
.board.R{left:0;border-radius:0 12px 12px 0}
.stack{position:absolute;top:2px;height:calc(var(--ph) - 4px);background:repeating-linear-gradient(90deg,#fffaf0 0 1px,#e2d8ea 1px 2px)}
.stack.L{right:var(--pw);width:var(--tl,3px);border-radius:3px 0 0 3px}
.stack.R{left:var(--pw);width:var(--tr,9px);border-radius:0 3px 3px 0}
.pg{position:absolute;top:0;width:var(--pw);height:var(--ph);color:var(--ink);overflow:hidden;
  background:radial-gradient(circle,rgba(155,123,255,.16) 1.1px,transparent 1.5px) 0 0/18px 18px,linear-gradient(180deg,var(--paper),var(--paper-2))}
.pg.L{left:calc(-1*var(--pw));border-radius:6px 0 0 6px}
.pg.R{left:0;border-radius:0 6px 6px 0}
.pg::after{content:"";position:absolute;inset:0;pointer-events:none}
.pg.L::after{background:linear-gradient(270deg,rgba(90,70,160,.30) 0,rgba(90,70,160,.10) 4%,rgba(255,255,255,.4) 12%,transparent 24%)}
.pg.R::after{background:linear-gradient(90deg,rgba(90,70,160,.30) 0,rgba(90,70,160,.10) 4%,rgba(255,255,255,.4) 12%,transparent 24%)}
.pg-in{zoom:var(--fz,1);position:absolute;inset:0;padding:20px 20px 12px;display:flex;flex-direction:column;gap:12px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#cbbcff transparent}
.pg.L .pg-in{padding-right:28px}.pg.R .pg-in{padding-left:28px}
#book:not(.open) .board.L,#book:not(.open) .stack.L,#book:not(.open) #pgL,#book:not(.open) .gutter,#book.open #cover{display:none}
.gutter{position:absolute;left:-3px;top:0;width:6px;height:var(--ph);background:linear-gradient(90deg,rgba(90,70,160,.12),rgba(90,70,160,.4) 50%,rgba(90,70,160,.12));pointer-events:none;z-index:2}
.cast-shadow{position:absolute;top:0;width:var(--pw);height:var(--ph);pointer-events:none;opacity:0;z-index:3}
#shR{left:0;background:linear-gradient(90deg,rgba(60,45,130,.4),rgba(60,45,130,.08) 70%,transparent)}
#shL{left:calc(-1*var(--pw));background:linear-gradient(270deg,rgba(60,45,130,.36),rgba(60,45,130,.06) 70%,transparent)}
.bookmark{position:absolute;left:14px;top:calc(var(--ph) - 4px);width:18px;height:52px;z-index:-1;background:linear-gradient(90deg,#ff5ea2,#ff9cc8 45%,#ff5ea2);clip-path:polygon(0 0,100% 0,100% 100%,50% 80%,0 100%)}

/* turning leaf */
.leaf{position:absolute;left:0;width:0;z-index:5;transform-style:preserve-3d;pointer-events:none}
.strip{position:absolute;top:0;transform-origin:0 50%;transform-style:preserve-3d;will-change:transform}
.face{position:absolute;top:0;left:0;height:100%;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.back{transform:rotateY(180deg)}
.face .ghost{position:absolute!important;top:0!important;margin:0!important;display:block!important;border-radius:0!important;visibility:visible!important}
/* the moving copy of a page skips the costly effects; they come back when it lands */
.face .ghost *,.face .ghost{animation:none!important;transition:none!important;filter:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
.face .ghost .btn,.face .ghost .linebox,.face .ghost .rp,.face .ghost .lesson,.face .ghost .scorebox,.face .ghost .infobox div,.face .ghost .plate{box-shadow:none!important}
.face .ghost .pg-in{overflow:hidden!important}
.face .shade{position:absolute;inset:0;background:#4b3f98;opacity:0;pointer-events:none}
.face.back .shade{background:linear-gradient(90deg,#4b3f98,#8f7fe0)}

/* cover */
.cover{position:absolute;left:0;top:-8px;width:calc(var(--pw) + 10px);height:calc(var(--ph) + 16px);border:0;padding:0;cursor:pointer;overflow:hidden;
  border-radius:4px 14px 14px 4px;color:#fff;text-align:center;display:block;
  background:radial-gradient(circle at 20% 15%,rgba(255,255,255,.3),transparent 40%),radial-gradient(circle,rgba(255,255,255,.13) 1px,transparent 1.5px) 0 0/14px 14px,linear-gradient(160deg,var(--bk2,#7d63ff),var(--bk1,#4fb4ff));
  box-shadow:inset 0 2px 0 rgba(255,255,255,.4),inset -3px 0 6px rgba(50,30,140,.3),2px 2px 0 #fffaf0,4px 4px 0 #ece3f4,6px 6px 0 #ddd2ec,8px 8px 0 var(--bk1,#4a3fb8)}
.cover .hinge{position:absolute;left:0;top:0;bottom:0;width:22px;background:linear-gradient(90deg,rgba(50,30,140,.45),rgba(255,255,255,.25) 38%,rgba(50,30,140,.32) 62%,rgba(255,255,255,.18) 80%,transparent)}
.cover .foilframe{position:absolute;inset:14px 14px 14px 32px;border-radius:18px;border:3px solid transparent;background:var(--holo) border-box;
  -webkit-mask:linear-gradient(#000 0 0) padding-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) padding-box exclude,linear-gradient(#000 0 0)}
.cover .twinkle{position:absolute;width:22px;height:22px}
.cover .body{position:absolute;inset:14px 14px 14px 32px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:22px 18px 20px}
.cover .series{font-family:var(--f-logo);font-weight:700;letter-spacing:.2em;font-size:14px;color:#fff;text-shadow:0 2px 6px rgba(50,30,140,.5)}
.cover .scene{width:min(78%,250px);height:auto;filter:drop-shadow(0 8px 14px rgba(50,30,140,.35))}
.plate{position:relative;padding:10px 18px 8px;border-radius:18px;background:#fff;color:var(--ink);box-shadow:0 10px 20px rgba(50,30,140,.3)}
.plate::before{content:"";position:absolute;inset:-3px;border-radius:21px;padding:3px;background:var(--holo);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.plate h1{font-size:clamp(20px,calc(var(--pw)*.066),28px);line-height:1.45;color:#4c33b8}
.plate .tiny{font-family:var(--f-head);font-weight:600;font-size:13px;color:var(--ink-soft)}
.seal{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-logo);font-weight:700;font-size:20px;color:#fff;text-shadow:0 1px 2px rgba(50,30,140,.6);
  background:conic-gradient(from 30deg,#7ee8fa,#9fb4ff,#d3a6ff,#ffa6d1,#ffe29a,#7ee8fa);box-shadow:0 0 0 3px #fff,0 8px 16px rgba(50,30,140,.35)}

/* back cover and closing the book */
.cover.backcover{left:calc(-1*var(--pw) - 10px);border-radius:14px 4px 4px 14px;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.4),inset 3px 0 6px rgba(50,30,140,.3),-2px 2px 0 #fffaf0,-4px 4px 0 #ece3f4,-6px 6px 0 #ddd2ec,-8px 8px 0 var(--bk1,#4a3fb8)}
.cover.backcover .hinge{left:auto;right:0;transform:scaleX(-1)}
.cover.backcover .foilframe{inset:14px 32px 14px 14px}
.cover.backcover .body{inset:14px 32px 14px 14px;justify-content:center;gap:14px}
.bc-kick{font-family:var(--f-head);font-weight:700;font-size:13px;letter-spacing:.06em;color:#ffe08a;padding:2px 12px;border-radius:999px;background:rgba(255,255,255,.14)}
.bc-moral{font-family:var(--f-en);font-weight:600;font-size:clamp(17px,calc(var(--pw)*.056),22px);line-height:1.45;color:#fff;text-shadow:0 1px 3px rgba(40,20,90,.5);max-width:92%}
.bc-moral-th{font-family:var(--f-head);font-weight:600;font-size:clamp(14px,calc(var(--pw)*.045),17px);line-height:1.6;color:#f1ecff;max-width:92%}
.bc-score{font-family:var(--f-logo);font-weight:700;font-size:20px;color:#ffe08a;text-shadow:0 1px 3px rgba(40,20,90,.5)}
.cover.backcover .stars svg{width:26px;height:26px}
.bc-quote{font-family:var(--f-head);font-weight:600;font-size:15px;line-height:1.7;color:#fff;text-shadow:0 1px 3px rgba(40,20,90,.5);max-width:90%}
.bc-small{font-family:var(--f-head);font-weight:600;font-size:13px;color:#e8e2ff}
#book:not(.back) #backcover{display:none}
#book.back .board,#book.back .stack,#book.back .pg,#book.back .gutter,#book.back .cast-shadow,#book.back #cover{display:none}
#book.back .bookshadow{left:calc(-1*var(--pw) - 10px);width:calc(var(--pw) + 10px)}
#book.back .bookmark{left:calc(-1*var(--pw) + 4px)}
#book.landR .board.R,#book.landR .stack.R,#book.landR #pgR{visibility:hidden}
#book.landL .board.L,#book.landL .stack.L,#book.landL #pgL{visibility:hidden}
.endpaper .ex .btn{margin-top:10px}

/* ───── page content ───── */
.endpaper{position:absolute;inset:0;display:grid;place-items:center;
  background:radial-gradient(circle at 12px 12px,rgba(255,255,255,.55) 1.4px,transparent 2px) 0 0/24px 24px,linear-gradient(160deg,var(--bk2,#9a86ff),var(--bk1,#6f8dff))}
.endpaper .ex{background:#fff;color:var(--ink);padding:16px 24px;border-radius:18px;text-align:center;box-shadow:0 10px 24px rgba(50,30,140,.3);max-width:76%}
.endpaper .ex b{display:block;font-family:var(--f-head);font-size:18px;color:#4c33b8}
.pagehead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.qno{font-family:var(--f-head);font-weight:700;font-size:22px;color:#4c33b8;line-height:1.2}
.qno small{font-family:var(--f-logo);font-size:14px;color:var(--ink-soft);font-weight:600}
.lvchip{font-family:var(--f-logo);font-weight:700;font-size:12.5px;color:#fff;padding:2px 11px;border-radius:999px;background:linear-gradient(135deg,#5fa8ff,#9b7bff);white-space:nowrap}
.lvchip.ans{background:linear-gradient(135deg,#3fd0b8,#2fa8d8)}
.pips{display:flex;gap:5px}
.pip{width:9px;height:9px;border-radius:50%;background:#e6e0f8}
.pip.done{background:linear-gradient(135deg,#5fe0cc,#5fa8ff)}
.pip.now{background:var(--pink);box-shadow:0 0 0 3px rgba(255,111,174,.25)}
.cast{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cast .k{font-family:var(--f-head);font-weight:700;font-size:13px;color:var(--ink-soft)}
.who{display:inline-flex;align-items:center;gap:6px;padding:1px 11px 1px 3px;border-radius:999px;background:#fff;box-shadow:0 0 0 2px #ffbcd8;font-family:var(--f-head);font-weight:700;font-size:14.5px}
.who i{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,#ffaed0,#ff6fae);display:grid;place-items:center;font-style:normal;color:#fff;font-size:12px;font-family:var(--f-logo)}
.who b{font-family:var(--f-en);font-weight:700;color:#e0408a}
.who i.g{font-family:system-ui,"Segoe UI Symbol","Noto Sans Symbols 2",sans-serif;font-size:14px;font-weight:700}
.who i.m{background:linear-gradient(135deg,#8ec5ff,#3d8bff)}
.who i.an{width:26px;height:26px;background:#fff4dc;box-shadow:0 0 0 1.500px #ffb870;font-size:15px;font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif}
.prev{font-family:var(--f-head);font-weight:500;font-size:14.5px;line-height:1.6;color:#5c558d;padding:7px 12px;border-radius:14px;background:rgba(155,123,255,.1)}
.prev span{display:block;font-size:12px;font-weight:700;color:#8f74f0}
.linebox{position:relative;border-radius:18px;padding:28px 14px 12px;background:#fff;box-shadow:0 0 0 2.5px #ddd0ff,0 8px 16px rgba(155,123,255,.14)}
.tense{position:absolute;top:-2px;right:-2px;font-family:var(--f-head);font-weight:700;font-size:14px;color:#fff;padding:2px 13px 3px 15px;border-radius:0 18px 0 16px;background:linear-gradient(135deg,#b69aff,#8f6cf0)}
.tense[data-t="อดีต"]{background:linear-gradient(135deg,#ffbe5c,#ff8a4c)}
.tense[data-t="ปัจจุบัน"]{background:linear-gradient(135deg,#ff92c4,#ff5ea2)}
.tense[data-t="อนาคต"]{background:linear-gradient(135deg,#7fc4ff,#4a88ff)}
.thai{font-family:var(--f-head);font-weight:700;font-size:clamp(20px,calc(var(--pw)*.064),25px);line-height:1.6;color:var(--ink)}
.lab{font-family:var(--f-logo);font-weight:700;letter-spacing:.1em;font-size:12.5px;color:#7a5ae0}
textarea{width:100%;min-height:104px;resize:none;border:0;border-radius:4px;padding:0 4px;flex:none;
  font-family:var(--f-en);font-weight:500;font-size:21px;line-height:34px;color:var(--ink);background:repeating-linear-gradient(180deg,transparent 0,transparent 33px,rgba(155,123,255,.5) 33px,rgba(155,123,255,.5) 34px)}
textarea::placeholder{color:#b6abdc}
.cluebox{padding:7px 12px;border-radius:12px;background:#e3faf5;box-shadow:inset 4px 0 0 var(--mint);font-family:var(--f-head);font-weight:600;font-size:15px;line-height:1.6}
.cluebox b{font-family:var(--f-en);font-weight:700;color:#14907d}
.note{font-family:var(--f-head);font-weight:600;font-size:14px;color:#e0408a}
.pagefoot{margin-top:auto;display:flex;justify-content:center;font-family:var(--f-logo);font-weight:700;color:#b1a5dc;font-size:14px}
.written{position:relative;padding:10px 12px;border-radius:16px;background:#fff;box-shadow:0 0 0 2.5px #c9f2ea}
.hand{font-family:var(--f-en);font-weight:600;font-size:20px;line-height:1.5;color:#4c33b8;padding-right:62px;min-height:28px}
.sticker{position:absolute;top:-16px;right:-8px;width:70px;height:70px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(12deg);
  background:conic-gradient(from 0deg,#7ee8fa,#9fb4ff,#d3a6ff,#ffa6d1,#ffe29a,#7ee8fa);box-shadow:0 0 0 3px #fff,0 8px 14px rgba(90,70,180,.3);color:#fff;text-shadow:0 1px 2px rgba(50,30,140,.6);line-height:1}
.sticker b{font-family:var(--f-logo);font-size:23px}
.sticker small{font-family:var(--f-logo);font-size:11px;font-weight:700}
.sticker.pop{animation:stamp .6s cubic-bezier(.3,1.6,.5,1) both}
@keyframes stamp{from{transform:rotate(-30deg) scale(2.2);opacity:0}to{transform:rotate(12deg) scale(1);opacity:1}}
.waiting{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;border-radius:20px;border:2.5px dashed #d8ccff;background:rgba(255,255,255,.6);padding:20px}
.waiting .w-t{font-family:var(--f-head);font-weight:700;font-size:21px;color:#8f74f0}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.center h1{font-size:clamp(21px,calc(var(--pw)*.068),28px);line-height:1.45;color:#4c33b8}
.badges{gap:10px!important;width:100%}
.badge{font-family:var(--f-logo);font-weight:700;font-size:12.5px;padding:2px 12px;border-radius:999px;color:#5a3fd0;background:#fff;box-shadow:0 0 0 2px #d6c8ff}
.infobox{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.infobox div{min-width:74px;padding:6px 8px;border-radius:14px;background:#fff;box-shadow:0 0 0 2px #e2d8ff;line-height:1.25}
.infobox b{display:block;font-family:var(--f-logo);font-size:22px;color:#5a3fd0}
.infobox small{font-family:var(--f-head);font-weight:600;font-size:12px;color:var(--ink-soft)}

.ring{--r:.5;width:86px;height:86px;flex:none;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(closest-side,#fff 76%,transparent 77%),conic-gradient(#ff7fb8,#9b7bff calc(var(--r)*50%),#5fa8ff calc(var(--r)*100%),#ebe5fb 0)}
.ring .n{font-family:var(--f-logo);font-weight:700;font-size:30px;line-height:1;color:#5a3fd0}
.ring .of{font-family:var(--f-logo);font-weight:600;font-size:12px;color:var(--ink-soft)}
.cheer{font-family:var(--f-head);font-weight:700;font-size:16.5px;line-height:1.5;color:#e0408a}
.pair{display:flex;flex-direction:column;gap:3px}
.tag{align-self:flex-start;font-family:var(--f-head);font-weight:700;font-size:12.5px;color:#fff;padding:1px 11px;border-radius:999px}
.tag.me{background:linear-gradient(135deg,#ff92c4,#ff5ea2)}
.tag.ok{background:linear-gradient(135deg,#5fe0cc,#2fbfa8)}
.tag.ai{background:linear-gradient(135deg,#9b7bff,#5fa8ff)}
.aibox{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border-radius:16px;background:#f1ecff;box-shadow:inset 0 0 0 2px #e2d8ff}
.aibox .tip{font-family:var(--f-head);font-weight:600;font-size:15px;line-height:1.6;color:#4c33b8}
.m-status{margin-top:12px;padding:8px 12px;border-radius:12px;text-align:center;font-family:var(--f-head);font-weight:700;font-size:14px;line-height:1.55;color:#fff;background:rgba(255,255,255,.14)}
.m-resume{margin-top:12px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border-radius:14px;background:rgba(255,255,255,.12);font-family:var(--f-head);font-weight:600;font-size:14px;color:#fff}
.m-resume b{color:#ffe08a}
.spin-dot{display:inline-block;width:14px;height:14px;margin-right:6px;vertical-align:-2px;border-radius:50%;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.en{font-family:var(--f-en);font-weight:500;font-size:20px;line-height:1.55;color:var(--ink)}
.en.model{font-weight:600;color:#14907d}
.en .hit{background:linear-gradient(transparent 56%,#ffe27a 56%)}
.en .clue{color:#9d88ea;border-bottom:2px dotted #9d88ea}
.en .miss{color:#a29cc8}
.lesson{padding:12px 14px;border-radius:18px;background:#f5f1ff;box-shadow:inset 0 0 0 2px #e6dcff}
.lesson h3{font-size:17px;line-height:1.45;color:#4c33b8;margin:2px 0 6px}
.lesson p{font-family:var(--f-body);font-weight:500;font-size:15.5px;line-height:1.7}
.lesson p + p{margin-top:8px}
.lesson em{font-style:normal;font-family:var(--f-en);font-weight:700;color:#e0408a}

/* end pages */
.story{font-family:var(--f-head);font-weight:600;font-size:16px;line-height:1.85}
.story.en{font-family:var(--f-en);font-weight:500;font-size:18px;line-height:1.75;color:#14907d}
.total{font-family:var(--f-logo);font-weight:700;font-size:56px;line-height:1;background:linear-gradient(135deg,#ff7fb8,#9b7bff,#5fa8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.stars{display:flex;gap:4px}
.stars svg{width:32px;height:32px}
.tally{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%}
.tally div{padding:4px 0;border-radius:12px;background:#fff;box-shadow:0 0 0 2px #e2d8ff;font-family:var(--f-logo);font-weight:700;color:#5a3fd0;line-height:1.3}
.tally small{display:block;font-family:var(--f-head);font-weight:600;color:var(--ink-soft);font-size:11.5px}

canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:8}

  return a;
}

function loadWallet(){
  let w = null; try{ w = JSON.parse(localStorage.getItem(WKEY)); }catch(e){}
  if(!w || w.earned == null) w = { earned: LIB.reduce((a,b) => a + (b.total || 0), 0), spent: 0, cases: 1 };
  w.cases = Math.max(w.cases || 1, Math.ceil(LIB.length / 6), 1);

}

const norm = w => w.toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z0-9']/g,"");
const toks = s => s.split(/\s+/).map(norm).filter(Boolean);
const words = s => s.trim().split(/\s+/).filter(Boolean);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function lcsPairs(a, b){
  const n=a.length, m=b.length, d=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--) d[i][j] = a[i]===b[j] ? d[i+1][j+1]+1 : Math.max(d[i+1][j], d[i][j+1]);
  const pairs=[]; let i=0,j=0;
  while(i<n && j<m){ if(a[i]===b[j]){pairs.push([i,j]);i++;j++;} else if(d[i+1][j]>=d[i][j+1]) i++; else j++; }
  return pairs;
}
function grade(line, text, clued, vocabUsed, max){
  const user = toks(text);
  const noScore = new Set(clued.concat(vocabUsed ? line.vwords : []));
  let best = null;
  for(const ref of line.refs){
    const r = toks(ref), pairs = lcsPairs(r, user);
    const earned = pairs.filter(([i]) => !noScore.has(r[i])).length;
    const pts = Math.round(max * earned / r.length);
    if(!best || pts > best.pts || (pts === best.pts && pairs.length > best.pairs.length)) best = {pts, ref, pairs};
  }
  const hit = new Set(best.pairs.map(p => p[1]));
  best.userMarks = user.map((w,j) => !hit.has(j) ? "miss" : (noScore.has(w) ? "clue" : "hit"));
  return best;
}
function cheer(q){
  if(q>=.9) return "สวยมาก เขียนได้แทบเหมือนเฉลยเลย";
  if(q>=.6) return "ใจความมาแล้ว เหลือเก็บรายละเอียดอีกนิดเดียว";
  if(q>=.3) return "ได้คำสำคัญมาแล้ว ข้อถัดไปเอาหลักนี้ไปลองใช้ต่อ";

}

function setCam(m){

  if(m === "closed") tx = -(pw+10)/2;

/* ───── the turning leaf: nested strips, each hinged on the one before, so the sheet bends ───── */
function ghost(node, w, h, left){
  const g = node.cloneNode(true);
  g.removeAttribute("id"); g.classList.add("ghost");
  for(const el of g.querySelectorAll("[id]")) el.removeAttribute("id");
  g.style.cssText += `;left:${left}px;width:${w}px;height:${h}px`;
  return g;
}
function buildLeaf(front, back, w, h, top, n){
  const leaf = document.createElement("div"); leaf.className = "leaf"; leaf.style.top = top+"px"; leaf.style.height = h+"px";
  const sw = w/n, strips = []; let parent = leaf;
  for(let k=0;k<n;k++){
    const s = document.createElement("div"); s.className = "strip";
    s.style.cssText = `left:${k?sw:0}px;width:${sw}px;height:${h}px`;
    const fw = sw + (k<n-1 ? 1 : 0);
    const f = document.createElement("div"); f.className = "face front"; f.style.width = fw+"px";
    f.appendChild(ghost(front, w, h, -k*sw));
    const b = document.createElement("div"); b.className = "face back"; b.style.cssText = `width:${fw}px;left:${k<n-1?-1:0}px`;
    b.appendChild(ghost(back, w, h, -(w-(k+1)*sw) + (k<n-1?1:0)));
    const fs = document.createElement("div"), bs = document.createElement("div"); fs.className = bs.className = "shade";
    f.appendChild(fs); b.appendChild(bs);
    s.append(f, b); parent.appendChild(s); parent = s; strips.push({el:s, fs, bs});
  }
  return {leaf, strips};
}
const clamp01 = x => Math.max(0, Math.min(1, x)), smooth = x => x*x*(3-2*x);
const noBookAnim = () => still() || !SET.bookAnim;
function poseLeaf({strips}, p, rigid, reverse){
  const n = strips.length, D = .6;
  let prev = 0;
  for(let k=0;k<n;k++){
    const u = n>1 ? k/(n-1) : 1;
    /* the free edge leads, the part near the spine follows, with a soft belly in the middle of the sheet */
    const fw = rigid ? -180*p : -180*smooth(clamp01(p*(1+D) - D*(1-u))) - 15*Math.sin(Math.PI*p)*Math.sin(Math.PI*(k+1)/n);
    const a = reverse ? -180 - fw : fw;
    strips[k].el.style.transform = `rotateY(${(a-prev).toFixed(2)}deg)`;
    const edge = Math.abs(Math.sin(a*Math.PI/180));
    strips[k].fs.style.opacity = (.22*edge).toFixed(3);
    strips[k].bs.style.opacity = (.2*edge + .08*(1-p)).toFixed(3);
    prev = a;
  }
}
function runLeaf(parts, dur, rigid, done, reverse){
  const { leaf } = parts, t0 = performance.now();
  const shL = reverse ? $("shR") : $("shL"), shR = reverse ? $("shL") : $("shR");
  (function step(now){
    const t = clamp01((now - t0)/dur), p = t<.5 ? 2*t*t : 1 - Math.pow(-2*t+2,2)/2;
    poseLeaf(parts, p, rigid, reverse);
    shR.style.opacity = clamp01(.7*(1-1.7*p)).toFixed(3);
    shL.style.opacity = (clamp01((p-.35)/.4) * clamp01((1-p)*2.2) * .7).toFixed(3);
    if(t<1) requestAnimationFrame(step);
    else { shL.style.opacity = shR.style.opacity = 0; done(); leaf.remove(); }
  })(t0);
}
function tempPage(side, html){ const d = document.createElement("div"); d.className = "pg "+side; d.innerHTML = html; return d; }

function pickStory(level){
  /* mostly from the genres the player likes, sometimes another one, never the same story twice in a row */
  const pool = STORIES.filter(s => s.level === level);
  if(!pool.length) return STORIES[0];
  const cand = pool.length > 1 ? pool.filter(s => s.id !== S.lastStory) : pool;
  const liked = P ? cand.filter(s => s.tags.some(t => P.likes.includes(t))) : [];
  const other = cand.filter(s => !liked.includes(s));
  const from = liked.length && (Math.random() < .75 || !other.length) ? liked : (other.length ? other : cand);
  const s = from[Math.floor(Math.random()*from.length)];
  S.lastStory = s.id;
  return s;
}

      if(old){
        old.plays = (old.plays || 1) + 1;

const FX = (function(){
  const c = $("fx"), x = c.getContext("2d"), cols = ["#fff3c4","#ffe08a","#ffffff","#f7c3d3"];
  let W, H, P = [], C = [], running = false;
  function size(){ W = c.width = innerWidth; H = c.height = innerHeight; }
  size(); addEventListener("resize", size);
  for(let i=0;i<(smoothMode() ? 0 : 22);i++) P.push({x:Math.random(), y:Math.random(), r:1.4+Math.random()*2.2, s:.0003+Math.random()*.0005, p:Math.random()*6.28, c:cols[i%cols.length]});
  function frame(t){
    x.clearRect(0,0,W,H);
    for(const p of P){
      if(!still()){ p.y += p.s; if(p.y > 1.03) p.y = -.03; }
      const px = p.x*W + Math.sin(t/1600 + p.p)*30, py = p.y*H;
      x.save(); x.translate(px, py); x.rotate(Math.sin(t/900 + p.p)); x.globalAlpha = .8; x.fillStyle = p.c;
      x.beginPath(); x.ellipse(0, 0, p.r, p.r*.55, 0, 0, 6.28); x.fill(); x.restore();
    }
    for(const q of C){
      q.vy += .12; q.x += q.vx; q.y += q.vy; q.vx *= .99; q.a += q.va;
      x.save(); x.translate(q.x, q.y); x.rotate(q.a); x.fillStyle = q.c; x.fillRect(-4, -2.5, 8, 5); x.restore();
    }
    C = C.filter(q => q.y < H + 30);
    if((!still() && P.length && !document.body.classList.contains("reading")) || C.length) requestAnimationFrame(frame); else { running = false; x.clearRect(0,0,W,H); }
  }
  function start(){ if(!running){ running = true; requestAnimationFrame(frame); } }
  new MutationObserver(() => { if(!document.body.classList.contains("reading")) start(); }).observe(document.body, { attributes:true, attributeFilter:["class"] });
  start();
  return { burst(n){
    if(still()) return;
    const conf = ["#ff7fb8","#9b7bff","#5fa8ff","#2fbfa8","#ffcf5a","#ffffff"];
    for(let i=0;i<n;i++) C.push({x:W/2 + (Math.random()-.5)*W*.5, y:H*.3, vx:(Math.random()-.5)*11, vy:-4-Math.random()*8, a:Math.random()*6, va:(Math.random()-.5)*.3, c:conf[i%conf.length]});
    start();
  }};
})();

/* ───── the round library (home), real 3D with three.js ─────
   A small round room. The camera orbits the altar in the middle; the altar never turns.
   Bookcase k stands at angle -k·45° (k = 0 behind the altar, then to the right). Each one shows 6 books face-out.
   You can only turn as far as you have bookcases; with all 8 the room turns all the way round.
   Every upgrade adds a bookcase and one new decoration. */
const TAU = Math.PI * 2;
const ROOM = { Rw:2.9, camR:2.3, camY:1.95, slope:-.005, slots:MAX_CASES, perCase:6, perRow:3, theta:0, target:0, drag:null, dragged:false, pendingFocus:null, cases:[] };
const CASE = { W:1.9, D:.44, cabH:1.55, rowH:.95, rows:2, crownH:.34 };
const CASE_H = CASE.cabH + CASE.rows * CASE.rowH + CASE.crownH, WALL_H = 4.6;
const DECOR_NAMES = ["โคมระย้าทองเหนือแท่น", "ต้นไม้ในกระถางข้างตู้", "หน้าต่างกระจกสีรอบห้อง", "ดาวระยิบบนเพดานโดม", "หนังสือวิเศษลอยรอบห้อง", "ธงประดับห้อง", "วงแหวนทองเรืองแสงบนพื้น"];
let G = null;
const stepA = () => TAU / ROOM.slots;
const fullCircle = () => WAL.cases >= MAX_CASES;
const rotMin = () => fullCircle() ? -Infinity : -(WAL.cases - 1) * stepA();
const rotMax = () => fullCircle() ? Infinity : 0;
const clampTheta = t => Math.min(rotMax(), Math.max(rotMin(), t));

function canvasTex(w, h, draw){
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 8;
  return t;
}
function glowTex(inner, outer){
  return canvasTex(128, 128, (x) => { const g = x.createRadialGradient(64,64,0,64,64,64); g.addColorStop(0, inner); g.addColorStop(1, outer); x.fillStyle = g; x.fillRect(0,0,128,128); });
}
function initRoom(){

function buildRoomShell(){
  const { scene } = G, R = ROOM.Rw;
  const floorTex = canvasTex(1024, 1024, (x, w) => {
    const c = w/2, unit = c / R;
    x.fillStyle = "#7a4a2a"; x.fillRect(0, 0, w, w);
    for(let r = 20; r < c; r += 34){
      x.strokeStyle = "rgba(50,25,10,.45)"; x.lineWidth = 2; x.beginPath(); x.arc(c, c, r, 0, TAU); x.stroke();
      x.strokeStyle = "rgba(255,200,140,.08)"; x.lineWidth = 14; x.beginPath(); x.arc(c, c, r + 16, 0, TAU); x.stroke();
      const seams = Math.max(6, Math.round(r / 18));
      for(let k=0;k<seams;k++){ const an = (k + (r % 3) * .33) / seams * TAU; x.strokeStyle = "rgba(50,25,10,.35)"; x.lineWidth = 2; x.beginPath(); x.moveTo(c + Math.cos(an)*r, c + Math.sin(an)*r); x.lineTo(c + Math.cos(an)*(r+34), c + Math.sin(an)*(r+34)); x.stroke(); }
    }
    const rug = 1.7 * unit, g = x.createRadialGradient(c, c, 0, c, c, rug);

  for(let r=1;r<rows;r++) box(W - .1, .05, D, M.wood, 0, cabH + r*rowH, 0);

/* front cover of a finished book, facing into the room; the title is large so it reads from the altar */
function wrapThai(x, text, maxW){
  const seg = window.Intl && Intl.Segmenter ? [...new Intl.Segmenter("th", { granularity:"word" }).segment(text)].map(p => p.segment) : Array.from(text);
  const lines = []; let cur = "";
  for(const w of seg){ if(x.measureText(cur + w).width > maxW && cur){ lines.push(cur); cur = w.trimStart(); } else cur += w; }
  if(cur) lines.push(cur);
  return lines;

function bindRoomInput(){

  addEventListener("pointermove", e => {
    const d = ROOM.drag;

      if(ROOM.dragged){
        const now = performance.now(), lo = rotMin(), hi = rotMax();

        if(t < lo) t = lo + (t - lo) * .2;
        ROOM.target = ROOM.theta = t;
        d.v = (e.clientX - d.lx) / Math.max(1, now - d.t); d.lx = e.clientX; d.t = now;

function frame(){

  if(!(ROOM.drag && ROOM.dragged)) ROOM.theta += (ROOM.target - ROOM.theta) * ease;
  const { camera } = G, th = ROOM.theta;
  camera.position.set(Math.sin(th) * ROOM.camR, ROOM.camY, Math.cos(th) * ROOM.camR);
  camera.lookAt(0, ROOM.camY + ROOM.slope * ROOM.camR, 0);
  for(const c of ROOM.cases){
    if(c.userData.rise < 1){ c.userData.rise = Math.min(1, c.userData.rise + dt / 1.4); const e = 1 - Math.pow(1 - c.userData.rise, 3); c.position.y = -(1 - e) * (CASE_H + .2); }
  }

    const s = 1.5 + Math.sin(t * 1.6) * .08; G.halo.scale.set(s, s, 1);

}

function parseLoose(t){

}

  try{ j = await AI.stream(prompt, STORY_SCHEMA, 1, text => onProgress && onProgress(Math.min(n, (text.match(/"refs"/g) || []).length), n)); }
  catch(err){
    if(!(err instanceof SyntaxError)) throw err;
    /* the streamed story came back garbled: ask once more, in one piece */
    onProgress && onProgress(0, n);
    j = await AI.call(prompt, STORY_SCHEMA, .8, 60000);
  }
  const lines = (j.lines || []).filter(l => l && l.th && l.refs && l.refs.some(Boolean)).map(l => {
    const vocab = (l.vocab || []).filter(v => v && v.th && v.en).slice(0, 3).map(v => [v.th.trim(), v.en.trim()]);
    const vwords = [...new Set(vocab.flatMap(v => toks(v[1])).filter(w => w.length > 2 && !STOP.has(w)))];
    return { th:l.th.trim(), tense:l.tense + (l.tenseNote ? " · " + l.tenseNote.trim() : ""), tkey:l.tense,
             refs:l.refs.map(x => String(x).trim()).filter(Boolean).slice(0, 6), vocab, vwords, name:(l.name || "").trim(), lesson:(l.lesson || []).slice(0, 3) };
  });
  if(lines.length < 3) throw new Error("เรื่องที่ได้สั้นเกินไป");
  return { id:"ai-" + Date.now(), ai:true, level, genre:(j.genre || "เรื่องสั้น").trim(), tags:[tag], title:(j.title || "เรื่องใหม่").trim().slice(0, 24),
           hue:Math.floor(Math.random() * 360), cast:(j.cast || []).slice(0, 3).map(c => [c.th, c.en, c.kind === "other" ? "" : c.kind]),
           moral:j.moral, lines };
}
async function gradeAI(line, text){
  const prompt = `Thai sentence: ${line.th}
Acceptable English translations: ${line.refs.join(" | ")}
Learner level: CEFR ${STORY.level}
Learner wrote: ${text.trim()}

score: from 0 to 1, how well the learner's English carries the whole meaning of the Thai sentence with grammar that is correct for the level. Any natural wording with the same meaning is fully correct, even if it is not in the list. Give fair partial credit; tiny spelling slips cost little; missing or wrong meaning costs more.
better: the learner's sentence corrected with as few changes as possible (exactly theirs if it is already correct).
tip: one short, kind sentence in Thai naming the main thing to fix, or praising what they did well if it is correct.`;
  const j = await AI.call(prompt, GRADE_SCHEMA, .2, 25000);
  return { score:Math.max(0, Math.min(1, +j.score || 0)), better:String(j.better || "").trim(), tip:String(j.tip || "").trim() };
}
const safeLesson = p => esc(p).replace(/&lt;(\/?)em&gt;/g, "<$1em>");

/* ───── the next story is written quietly in the background and kept for when the mystery book is opened ───── */
const NKEY = "trans-taller.next";
function loadPrepared(){ try{ const p = JSON.parse(localStorage.getItem(NKEY)); return p && p.story && p.story.lines ? p : null; }catch(e){ return null; } }
function takePrepared(level){ const p = loadPrepared(); if(p && p.level === level){ try{ localStorage.removeItem(NKEY); }catch(e){} return p.story; } return null; }
let preparing = null;
function prepareNext(level){
  if(!AI.has() || preparing || !P) return;
  const have = loadPrepared(); if(have && have.level === level) return;
  preparing = generateStory(level).then(story => { try{ localStorage.setItem(NKEY, JSON.stringify({ level, story })); }catch(e){} })
    .catch(() => {}).finally(() => { preparing = null; });
}

/* ───── progress: the story being played is kept, so it can be finished later ───── */
const CKEY = "trans-taller.current";
function saveCur(){
  if(MODE !== "play" || !STORY || S.idx >= STORY.lines.length) return;
  try{ localStorage.setItem(CKEY, JSON.stringify({ story:STORY, S:{ idx:S.idx, phase:S.phase, text:S.text, clued:S.clued, vocabUsed:S.vocabUsed, results:S.results, level:S.level, replayOf:S.replayOf, storyId:S.storyId } })); }catch(e){}
}
function loadCur(){ try{ const c = JSON.parse(localStorage.getItem(CKEY)); return c && c.story && c.S ? c : null; }catch(e){ return null; } }
function clearCur(){ try{ localStorage.removeItem(CKEY); }catch(e){} }
function resumeCur(){
  const c = loadCur(); if(!c) return;
  closeModal(); MODE = "play"; RB = null; STORY = c.story;
  Object.assign(S, c.S, { view:"open", justDone:-1, grading:false });
  S.spread = S.idx + 1; S.cam = S.phase === "answered" ? "right" : "left";
  paint(); goBook();
}

      <input class="field" id="set-key" type="password" placeholder="วาง Gemini API key ที่นี่" value="${esc(SET.apiKey || "")}" autocomplete="off" spellcheck="false">
      <div class="row"><button class="btn small" id="set-test">ทดสอบการเชื่อมต่อ</button><a class="fine" href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">ขอ key ฟรีที่ Google AI Studio (aistudio.google.com/apikey)</a></div>
      <p class="note" id="set-msg"></p>
      <details><summary class="fine" style="cursor:pointer">ชื่อโมเดล (ไม่ต้องแก้ก็ได้)</summary><input class="field" id="set-model" value="${esc(SET.model || AI_DEFAULT_MODEL)}" spellcheck="false"><span class="fine">gemini-flash-lite-latest เร็วที่สุด · gemini-flash-latest เขียนเก่งกว่าแต่ช้ากว่ามาก</span></details></div>
    <div class="setrow"><b>แอนิเมชันพลิกหน้าและเปิดหนังสือ</b><span>ปิดแล้วหน้าจะเปลี่ยนทันที ลื่นที่สุดบนมือถือ</span>${seg("bookAnim", [[true, "เปิด"], [false, "ปิด"]])}</div>
    <div class="setrow"><b>ขนาดตัวอักษร</b><span>ใช้กับหน้าหนังสือและหน้าต่างต่าง ๆ</span>${seg("font", [[.8, "เล็กมาก"], [.88, "เล็ก"], [1, "ปกติ"], [1.12, "ใหญ่"]])}
      <div class="preview"><div class="pv"><p class="thai" style="font-size:22px">คืนนี้ฝนตกหนักมาก</p><p class="en" style="font-size:19px;color:#14907d">It is raining very hard tonight.</p></div></div></div>
    <div class="setrow"><b>ภาพห้องสมุด 3 มิติ</b><span>โหมดลื่นปิดเงา ลดแสงและฝุ่นทอง เหมาะกับมือถือ มีผลเมื่อโหลดหน้าใหม่</span>${seg("quality", [["pretty", "สวยที่สุด"], ["smooth", "ลื่นที่สุด"]])}
      ${G && (SET.quality === "smooth") !== G.smoothBuilt ? `<button class="btn small" id="set-reload">โหลดหน้าใหม่ตอนนี้</button>` : ""}</div>
`;
}
function openSettings(){ renderSettings(); $("set").classList.add("on"); }
function closeSettings(){ $("set").classList.remove("on"); }
$("gear-home").onclick = openSettings;
$("gear-book").onclick = openSettings;
$("set-close").onclick = closeSettings;
$("set").addEventListener("click", e => {
  if(e.target.id === "set"){ closeSettings(); return; }
  if(e.target.id === "set-reload"){ location.reload(); return; }
  const b = e.target.closest("[data-set]"); if(!b) return;
  const key = b.dataset.set, raw = b.dataset.val;
  SET[key] = raw === "true" ? true : raw === "false" ? false : isNaN(+raw) ? raw : +raw;
  saveSettings(); applySettings(); renderSettings();
  if(key === "font" && S.screen === "book") layout();
});
addEventListener("keydown", e => { if(e.key === "Escape" && $("set").classList.contains("on")) closeSettings(); });
$("set").addEventListener("input", e => {
  if(e.target.id === "set-key"){ SET.apiKey = e.target.value.trim(); saveSettings(); }
  if(e.target.id === "set-model"){ SET.model = e.target.value.trim(); saveSettings(); }
});
$("set").addEventListener("click", async e => {
  if(e.target.id !== "set-test") return;
  const msg = $("set-msg");
  if(!AI.has()){ msg.textContent = "ใส่ API key ก่อนนะ"; return; }
  msg.textContent = "กำลังทดสอบ…";
  const t0 = Date.now();
  try{ const j = await AI.call('Reply with {"ok": true}', { type:"OBJECT", required:["ok"], properties:{ ok:{ type:"BOOLEAN" } } }, 0, 20000);
       msg.textContent = j.ok ? `เชื่อมต่อสำเร็จ · โมเดล ${AI.model()} ตอบใน ${((Date.now() - t0) / 1000).toFixed(1)} วินาที ✦ กำลังเตรียมเรื่องแรกไว้ให้` : "เชื่อมต่อได้ แต่คำตอบแปลก ๆ ลองอีกครั้ง";
       if(j.ok) prepareNext(S.level); }
  catch(err){ msg.textContent = aiErrorText(err); }
});
applySettings();

function start(data){
  if(data && data.screen) S = Object.assign(S, data);
  STORY = STORIES.find(x => x.id === S.storyId) || STORIES[0];
  paint();
  if(S.screen === "book") goBook(); else goMeadow();

}

if("serviceWorker" in navigator && /^https?:$/.test(location.protocol) && !/claudeusercontent|claude\.ai/.test(location.hostname)){
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
try{ navigator.storage?.persist?.(); }catch(e){}
window.claude?.hot?.snapshot?.(() => S);
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
